[project]
name = "rag-pgvector-workspace"
version = "0.1.0"
description = "Monorepo for a RAG system using AWS Bedrock Titan v2 embeddings, pgvector, and switchable Anthropic/Ollama LLMs."
readme = "README.md"
requires-python = "==3.12.*"

[tool.uv.workspace]
members = ["vectorizer", "question-api", "libs/rag-core", "evals"]

[tool.uv.sources]
rag-core = { workspace = true }
question-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "testcontainers[postgres]>=4.8.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "libs/rag-core/src",
    "vectorizer/src",
    "question-api/src",
    "evals/src",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
mypy_path = [
    "libs/rag-core/src",
    "vectorizer/src",
    "question-api/src",
    "evals/src",
]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "libs/rag-core/tests",
    "vectorizer/tests",
    "question-api/tests",
    "evals/tests",
    "tests",
]
pythonpath = [
    "libs/rag-core/src",
    "vectorizer/src",
    "question-api/src",
    "evals/src",
    "libs/rag-core/tests",
    "vectorizer/tests",
    "question-api/tests",
    "evals/tests",
    "tests",
]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: tests requiring external services (testcontainers, network)",
]
