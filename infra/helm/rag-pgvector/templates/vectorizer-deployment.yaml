{{- if .Values.vectorizer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag.fullname" . }}-vectorizer
  labels:
    {{- include "rag.componentLabels" (merge (dict "component" "vectorizer") (deepCopy .)) | nindent 4 }}
spec:
  replicas: {{ .Values.vectorizer.replicaCount }}
  selector:
    matchLabels:
      {{- include "rag.componentSelector" (dict "root" . "component" "vectorizer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag.componentSelector" (dict "root" . "component" "vectorizer") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "rag.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vectorizer
          image: {{ include "rag.image" (dict "root" . "component" .Values.vectorizer) | quote }}
          imagePullPolicy: {{ include "rag.imagePullPolicy" (dict "root" . "component" .Values.vectorizer) }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "rag.fullname" . }}-app
          env:
            {{- range $k, $v := .Values.vectorizer.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.vectorizer.resources | nindent 12 }}
{{- end }}
