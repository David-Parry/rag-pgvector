{{- if .Values.vectorizer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vectorizer
  labels:
    {{- include "rag.componentLabels" (merge (dict "component" "vectorizer") (deepCopy .)) | nindent 4 }}
spec:
  type: {{ .Values.vectorizer.service.type }}
  ports:
    - name: http
      port: {{ .Values.vectorizer.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rag.componentSelector" (dict "root" . "component" "vectorizer") | nindent 4 }}
{{- end }}
