apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag.serviceAccountName" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
  {{- if eq .Values.aws.auth.mode "irsa" }}
  {{- if not .Values.aws.auth.irsaRoleArn }}
    {{- fail "aws.auth.mode=irsa requires aws.auth.irsaRoleArn to be set" }}
  {{- end }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.aws.auth.irsaRoleArn | quote }}
  {{- end }}
