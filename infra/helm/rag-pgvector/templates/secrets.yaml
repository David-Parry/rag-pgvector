{{- $secretName := printf "%s-app" (include "rag.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ---------- Database ----------
  DATABASE_URL: {{ include "rag.databaseUrl" . | quote }}
  PGVECTOR_COLLECTION: "rag_chunks"

  # ---------- AWS Bedrock embeddings ----------
  AWS_REGION: {{ .Values.bedrock.region | quote }}
  EMBEDDING_MODEL: {{ .Values.bedrock.embeddingModelId | quote }}
  BEDROCK_EMBEDDING_DIMENSIONS: {{ .Values.bedrock.embeddingDimensions | quote }}
  ANTHROPIC_DIRECT_MODEL: {{ .Values.anthropic.model | quote }}
  ANTHROPIC_MAX_TOKENS: {{ .Values.anthropic.maxTokens | quote }}
  ANTHROPIC_TEMPERATURE: {{ .Values.anthropic.temperature | quote }}
  ANTHROPIC_TIMEOUT_SECONDS: {{ .Values.anthropic.timeoutSeconds | quote }}
  {{- if .Values.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ .Values.anthropic.apiKey | quote }}
  {{- end }}
  {{- if not .Values.anthropic.apiKey }}
    {{- fail "anthropic.apiKey is required for question-api" }}
  {{- end }}
  {{- if .Values.bedrock.embeddingBearerToken }}
  AWS_BEARER_TOKEN_BEDROCK: {{ .Values.bedrock.embeddingBearerToken | quote }}
  {{- end }}
  {{- if eq .Values.aws.auth.mode "bearer" }}
  {{- if and (not .Values.aws.auth.bearerToken) (not .Values.bedrock.embeddingBearerToken) }}
    {{- fail "aws.auth.mode=bearer requires aws.auth.bearerToken to be set" }}
  {{- end }}
  {{- if and .Values.aws.auth.bearerToken (not .Values.bedrock.embeddingBearerToken) }}
  AWS_BEARER_TOKEN_BEDROCK: {{ .Values.aws.auth.bearerToken | quote }}
  {{- end }}
  {{- else if eq .Values.aws.auth.mode "accessKey" }}
  {{- if or (not .Values.aws.auth.accessKeyId) (not .Values.aws.auth.secretAccessKey) }}
    {{- fail "aws.auth.mode=accessKey requires aws.auth.accessKeyId AND aws.auth.secretAccessKey" }}
  {{- end }}
  AWS_ACCESS_KEY_ID: {{ .Values.aws.auth.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.auth.secretAccessKey | quote }}
  {{- if .Values.aws.auth.sessionToken }}
  AWS_SESSION_TOKEN: {{ .Values.aws.auth.sessionToken | quote }}
  {{- end }}
  {{- else if eq .Values.aws.auth.mode "irsa" }}
  # IRSA: pods inherit AWS credentials from the ServiceAccount role; no keys here.
  {{- else if eq .Values.aws.auth.mode "none" }}
  # No AWS credentials injected. Use this for on-prem installs or non-Bedrock embedding providers.
  {{- else }}
    {{- fail (printf "Unknown aws.auth.mode %q (expected: none | bearer | accessKey | irsa)" .Values.aws.auth.mode) }}
  {{- end }}

  # ---------- govinfo ----------
  GOVINFO_API_KEY: {{ .Values.govinfo.apiKey | quote }}
  GOVINFO_BASE_URL: {{ .Values.govinfo.baseUrl | quote }}
