## ----------------------------------------------------------------------------
## rag-pgvector chart values
##
## The chart deploys postgres-pgvector, Redis Stack, vectorizer, and question-api.
## NO Ollama pod is deployed — Ollama is expected to run on the Docker Desktop
## host and is reached at http://host.docker.internal:11434 from question-api.
## ----------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

## Common image registry/tag defaults. Per-component overrides below.
image:
  registry: ""        # e.g. "ghcr.io/davidparry/" — leave blank for local Docker Desktop builds
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

## ----------------------------------------------------------------------------
## AWS Bedrock embedding authentication.
##
## auth.mode controls how the pods authenticate to AWS APIs:
##   - "none":                no AWS credentials are injected
##   - "bearer":              Secret holds AWS_BEARER_TOKEN_BEDROCK
##   - "accessKey":           Secret holds AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
##                            and optional AWS_SESSION_TOKEN
##   - "irsa":                no Secret keys; the ServiceAccount is annotated
##                            with eks.amazonaws.com/role-arn (for real EKS).
## ----------------------------------------------------------------------------
aws:
  auth:
    mode: none
    bearerToken: ""           # required when mode=bearer
    accessKeyId: ""           # required when mode=accessKey
    secretAccessKey: ""       # required when mode=accessKey
    sessionToken: ""           # optional when mode=accessKey (AWS SSO/session credentials)
    irsaRoleArn: ""           # required when mode=irsa

bedrock:
  region: us-east-1
  embeddingModelId: amazon.titan-embed-text-v2:0
  embeddingBearerToken: ""     # optional override; defaults to aws.auth.bearerToken
  embeddingDimensions: 1024

novaSonic:
  modelId: amazon.nova-2-sonic-v1:0
  roleArn: ""
  accessKeyId: ""
  secretAccessKey: ""
  sessionToken: ""
  credentialExpiration: ""

anthropic:
  apiKey: ""                    # required for question-api
  model: claude-sonnet-4-5
  maxTokens: 1024
  temperature: 0.0
  timeoutSeconds: 90

## ----------------------------------------------------------------------------
## govinfo (https://api.govinfo.gov)
## ----------------------------------------------------------------------------
govinfo:
  apiKey: ""
  baseUrl: https://api.govinfo.gov

## ----------------------------------------------------------------------------
## Postgres + pgvector pod
## ----------------------------------------------------------------------------
postgres:
  image:
    repository: rag-pgvector/postgres
    tag: "17"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    user: rag
    password: rag
    database: rag
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""          # blank = cluster default
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

## ----------------------------------------------------------------------------
## Redis Stack pod (LangGraph checkpointer/session state)
## ----------------------------------------------------------------------------
redisStack:
  enabled: true
  image:
    repository: redis/redis-stack-server
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

## ----------------------------------------------------------------------------
## vectorizer pod (PDF -> chunks -> embeddings -> pgvector)
## ----------------------------------------------------------------------------
vectorizer:
  enabled: true
  replicaCount: 1
  image:
    repository: rag-pgvector/vectorizer
    tag: ""                    # falls back to image.tag
    pullPolicy: ""             # falls back to image.pullPolicy
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 2Gi
  env:
    LOG_LEVEL: DEBUG
    LOG_FORMAT: json

## ----------------------------------------------------------------------------
## question-api pod (grounded RAG)
## ----------------------------------------------------------------------------
qa:
  enabled: true
  replicaCount: 1
  image:
    repository: rag-pgvector/question-api
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 8000

  ## Optional hostAliases for clusters where host.docker.internal does NOT resolve
  ## from inside pods. Each item is { ip: "...", hostnames: ["..."] }.
  hostAliases: []

  topK: 5
  scoreThreshold: 0.25

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 2Gi
  env:
    LOG_LEVEL: DEBUG
    LOG_FORMAT: json
    VOICE_ENABLED: "true"
    NOVA_SONIC_VOICE: matthew
    NOVA_SONIC_ENDPOINTING_SENSITIVITY: MEDIUM
