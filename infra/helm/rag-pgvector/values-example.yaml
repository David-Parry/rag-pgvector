# Example values overrides for `helm install -f infra/helm/rag-pgvector/values-example.yaml`.
# Copy this file (e.g. to `values.local.yaml`) and fill in real values; never commit secrets.

aws:
  auth:
    mode: accessKey
    accessKeyId: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
    secretAccessKey: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
    sessionToken: "REPLACE_WITH_AWS_SESSION_TOKEN_IF_USING_TEMPORARY_CREDENTIALS"

bedrock:
  region: us-east-1
  embeddingModelId: amazon.titan-embed-text-v2:0
  embeddingBearerToken: "REPLACE_WITH_EMBEDDING_ACCOUNT_BEDROCK_API_KEY"
  embeddingDimensions: 1024

novaSonic:
  modelId: amazon.nova-sonic-v1:0
  roleArn: "REPLACE_WITH_SONIC_AWS_ROLE_ARN"
  accessKeyId: "REPLACE_WITH_SONIC_AWS_ACCESS_KEY_ID"
  secretAccessKey: "REPLACE_WITH_SONIC_AWS_SECRET_ACCESS_KEY"
  sessionToken: "REPLACE_WITH_SONIC_AWS_SESSION_TOKEN"
  credentialExpiration: "REPLACE_WITH_SONIC_AWS_CREDENTIAL_EXPIRATION"

anthropic:
  apiKey: "REPLACE_WITH_DIRECT_ANTHROPIC_API_KEY"
  model: claude-sonnet-4-5

govinfo:
  apiKey: "REPLACE_WITH_GOVINFO_API_KEY"

redisStack:
  enabled: true
  image:
    repository: redis/redis-stack-server
    tag: "latest"

qa:
  topK: 5
  scoreThreshold: 0.25
  env:
    VOICE_ENABLED: "true"
    NOVA_SONIC_VOICE: matthew
    NOVA_SONIC_ENDPOINTING_SENSITIVITY: MEDIUM
