[project]
name = "question-api"
version = "0.1.0"
description = "FastAPI pod that answers grounded questions using Bedrock Titan v2 retrieval over pgvector and a switchable Anthropic Claude / Ollama LLM backend."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "rag-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "langchain>=1.2.0,<2.0.0",
    "langchain-aws>=1.4.0",
    "langchain-anthropic>=1.4.0",
    "langchain-ollama>=0.3.0",
    "langchain-postgres>=0.0.17",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/question_api"]

[project.scripts]
question-api = "question_api.main:run"
