[project]
name = "question-api"
version = "0.1.0"
description = "FastAPI pod that answers grounded questions using Titan v2 retrieval over pgvector and a direct Anthropic Claude LLM backend."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "rag-core==0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "langchain>=1.2.0,<2.0.0",
    "langchain-aws>=1.4.0",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-redis>=0.4.0,<1.0.0",
    "pipecat-ai[aws-nova-sonic,webrtc,silero]>=1.1.0",
    "pipecat-ai-small-webrtc-prebuilt>=2.4.0",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
question-api = "question_api.main:run"
