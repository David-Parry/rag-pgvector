[project]
name = "rag-core"
version = "0.1.0"
description = "Shared protocols, prompts, chunking, settings, and logging utilities for the rag-pgvector monorepo."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "langchain-core>=1.3.2,<1.4.0",
    "chonkie>=1.6,<1.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
