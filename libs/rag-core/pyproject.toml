[project]
name = "rag-core"
version = "0.1.0"
description = "Shared protocols, prompts, chunking, settings, and logging utilities for the rag-pgvector monorepo."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "langchain-core>=1.3.2,<1.4.0",
    "chonkie>=1.6,<1.6.5",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
