[project]
name = "rag-evals"
version = "0.1.0"
description = "DeepEval retriever benchmark for tuning pgvector top-k and score-threshold settings."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "rag-core",
    "question-api",
    "deepeval>=2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-aws>=1.4.0",
    "langchain-ollama>=0.3.0",
    "langchain-postgres>=0.0.17",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evals"]

[project.scripts]
rag-evals = "rag_evals.cli:main"
