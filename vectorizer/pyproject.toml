[project]
name = "vectorizer"
version = "0.1.0"
description = "Long-running FastAPI pod that fetches PDFs from api.govinfo.gov, extracts text via PyMuPDF, embeds with AWS Bedrock Titan v2, and upserts into pgvector."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "rag-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "pymupdf>=1.24.10",
    "langchain>=1.2.0,<2.0.0",
    "langchain-aws>=1.4.0",
    "langchain-postgres>=0.0.17",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.36",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vectorizer"
module-root = "src"

[project.scripts]
vectorizer = "vectorizer.main:run"
